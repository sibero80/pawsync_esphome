substitutions:
  name: "pawsync-feeder"
  friendly_name: "Pawsync PPF-R361S Feeder"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "Local ESPHome firmware for Pawsync PPF-R361S Pet Feeder with On-Device 7-Plan Scheduler"
  min_version: 2024.6.0
  on_boot:
    - priority: 2000.0
      then:
        - lambda: |-
            #if defined(USE_ESP_IDF)
            esp_ota_mark_app_valid_cancel_rollback();
            #endif
    - priority: -100.0
      then:
        - lambda: |-
            id(feeder_bridge).set_grams_per_portion_number(id(kibble_grams_per_portion));
            id(kibble_grams_per_portion).publish_state(id(feeder_bridge).get_grams_per_portion());

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf
  partitions: partitions.csv

external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG
  baud_rate: 0  # Disable logger UART to prevent interference with SC95F8766P link

api:
  encryption:
    key: !secret api_encryption_key
  services:
    # Service: Feed immediately with custom portion count (1..20)
    - service: feed
      variables:
        portions: int
      then:
        - lambda: |-
            id(feeder_bridge).feed(portions, true);

    # Service: Trigger stock single-meal kibble density calibration (opcode 0x5599)
    - service: measure_meal_stock
      then:
        - lambda: |-
            id(feeder_bridge).start_stock_measuring();

    # Service: Configure on-device meal schedule (7 plans x 10 meals)
    # plan: 1..7 (or 0 for active plan)
    # meal: 1..10 (meal slot)
    # enabled: true/false
    # hour: 0..23, minute: 0..59
    # portions: 1..20
    # days: bitmask (127=Daily, 62=Mon-Fri, 65=Sat-Sun)
    # sound: true/false
    - service: set_meal_schedule
      variables:
        plan: int
        meal: int
        enabled: bool
        hour: int
        minute: int
        portions: int
        days: int
        sound: bool
      then:
        - lambda: |-
            uint8_t p = (plan >= 1 && plan <= 7) ? (plan - 1) : id(feeder_bridge).get_active_plan();
            uint8_t m = (meal >= 1 && meal <= 10) ? (meal - 1) : 0;
            uint8_t d = (days > 0) ? days : 0x7F;
            id(feeder_bridge).set_meal_schedule(p, m, enabled, hour, minute, portions, d, sound);

    # Service: Clear all meals in a plan
    - service: clear_plan
      variables:
        plan: int
      then:
        - lambda: |-
            uint8_t p = (plan >= 1 && plan <= 7) ? (plan - 1) : id(feeder_bridge).get_active_plan();
            id(feeder_bridge).clear_plan(p);

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Pawsync-Feeder-Fallback"
    password: "fallbackpassword"

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    on_time_sync:
      then:
        - ppf_r361s.sync_clock:
            id: feeder_bridge

uart:
  - id: uart_coprocessor
    tx_pin: GPIO19
    rx_pin: GPIO18
    baud_rate: 115200

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO1
    i2s_bclk_pin: GPIO4

speaker:
  - platform: i2s_audio
    id: feeder_speaker_out
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin: GPIO5
    sample_rate: 32000
    channel: mono

media_player:
  - platform: speaker
    id: feeder_speaker
    name: "Meal Call Speaker"
    buffer_size: 16000
    announcement_pipeline:
      speaker: feeder_speaker_out
    on_announcement:
      - switch.turn_on: amp_enable
    on_idle:
      - switch.turn_off: amp_enable

output:
  - platform: gpio
    pin: GPIO0
    id: amp_enable_output

switch:
  - platform: output
    id: amp_enable
    name: "Amplifier Enable"
    output: amp_enable_output
    internal: true
  - platform: ppf_r361s
    child_lock:
      name: "Child Lock"
      restore_mode: RESTORE_DEFAULT_OFF
    slow_feed:
      name: "Slow Feed Mode"
    sleep_mode:
      name: "Sleep Mode"
    intelligent_feeding:
      name: "Intelligent Feeding (Leftover Deduction)"
  - platform: template
    name: "Unlock Factory Firmware Rollback"
    id: sw_unlock_factory_rollback
    icon: mdi:lock-alert
    entity_category: config
    optimistic: true
    turn_on_action:
      - logger.log: "WARNING: Factory firmware rollback interlock has been UNLOCKED!"
    turn_off_action:
      - logger.log: "Factory firmware rollback interlock is LOCKED."

ppf_r361s:
  id: feeder_bridge
  uart_id: uart_coprocessor
  time_id: sntp_time

sensor:
  - platform: ppf_r361s
    bowl_weight:
      name: "Bowl Weight"
    battery_level:
      name: "Battery Level"
    last_feed_weight:
      name: "Last Feed Weight"
    portions_today:
      name: "Portions Today"
    desiccant_days:
      name: "Desiccant Days Remaining"

binary_sensor:
  - platform: ppf_r361s
    power_adapter:
      name: "AC Power Connected"
    food_low:
      name: "Food Level Low"
    motor_jammed:
      name: "Motor Jammed"
    bowl_connected:
      name: "Bowl Scale Connected"
    battery_installed:
      name: "Battery Installed"

text_sensor:
  - platform: ppf_r361s
    status:
      name: "Feeder Status"
    next_meal:
      name: "Next Scheduled Meal"
    schedule_summary:
      name: "Today's Schedule Summary"

button:
  - platform: ppf_r361s
    tare:
      name: "Tare Bowl Scale"
    feed:
      name: "Feed 1 Portion"
      portions: 1
      sound: true
    calibrate_portion:
      name: "Calibrate Kibble Density (Empty Bowl First)"
    reset_desiccant:
      name: "Reset Desiccant (30 Days)"
  - platform: template
    name: "Feed Selected Portions"
    id: btn_feed_manual_portions
    icon: mdi:food-drumstick-outline
    on_press:
      - lambda: |-
          id(feeder_bridge).feed_manual_portions();
  - platform: template
    name: "Rollback to Factory Firmware (Slot ota_1)"
    id: btn_rollback_stock
    icon: mdi:backup-restore
    entity_category: config
    on_press:
      - then:
          - lambda: !lambda |-
              if (!id(sw_unlock_factory_rollback).state) {
                ESP_LOGW("rollback", "Rollback rejected: 'Unlock Factory Firmware Rollback' switch is OFF. Turn ON the unlock switch first.");
                return;
              }
              id(feeder_bridge).rollback_to_stock_firmware();

number:
  - platform: ppf_r361s
    feed_portions:
      name: "Manual Feed Portions"
  - platform: template
    name: "Grams per Portion (Kibble Calibration)"
    id: kibble_grams_per_portion
    min_value: 3.0
    max_value: 20.0
    step: 0.1
    initial_value: 8.0
    restore_value: true
    unit_of_measurement: "g"
    icon: "mdi:scale"
    set_action:
      - lambda: |-
          id(feeder_bridge).set_grams_per_portion(x);

# --- On-Device Schedule Interactive UI (Mapped to Plan 1 Meals 1-4) ---
select:
  - platform: template
    name: "Active Feeding Plan"
    id: select_active_plan
    options:
      - "Plan 1 (Daily)"
      - "Plan 2 (Weekdays)"
      - "Plan 3 (Weekends)"
      - "Plan 4 (Custom 1)"
      - "Plan 5 (Custom 2)"
      - "Plan 6 (Custom 3)"
      - "Plan 7 (Custom 4)"
    initial_option: "Plan 1 (Daily)"
    restore_value: true
    set_action:
      - lambda: |-
          uint8_t p = 1;
          if (x == "Plan 2 (Weekdays)") p = 2;
          else if (x == "Plan 3 (Weekends)") p = 3;
          else if (x == "Plan 4 (Custom 1)") p = 4;
          else if (x == "Plan 5 (Custom 2)") p = 5;
          else if (x == "Plan 6 (Custom 3)") p = 6;
          else if (x == "Plan 7 (Custom 4)") p = 7;
          id(feeder_bridge).set_active_plan(p - 1);
