name: Feature Request
description: Suggest an idea or enhancement for PawSync ESPHome
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve PawSync? Let us know what you have in mind!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem or limitation is.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false
