name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install esphome cryptography

      - name: Setup Dummy Secrets for Build
        run: |
          cp secrets.yaml.example secrets.yaml
          python3 -c "
          import secrets, base64
          with open('secrets.yaml', 'r') as f:
              content = f.read()
          noise_psk = base64.b64encode(secrets.token_bytes(32)).decode('ascii')
          content = content.replace('\"Generated_Base64_Key\"', f'\"{noise_psk}\"')
          with open('secrets.yaml', 'w') as f:
              f.write(content)
          "

      - name: Compile ESPHome Firmware
        run: |
          esphome compile pawsync.yaml

      - name: Package VeSync OTA Container
        run: |
          python tools/ota/build_vesync_ota.py .esphome/build/pawsync-feeder/build/firmware.ota.bin -o pawsync_ota_update.bin --version ${{ github.ref_name }}

      - name: Generate Checksums
        run: |
          sha256sum pawsync_ota_update.bin .esphome/build/pawsync-feeder/build/firmware.factory.bin .esphome/build/pawsync-feeder/build/firmware.ota.bin > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pawsync_ota_update.bin
            checksums.txt
            .esphome/build/pawsync-feeder/build/firmware.factory.bin
            .esphome/build/pawsync-feeder/build/firmware.ota.bin
