feed:
  name: Dispense Kibble
  description: Dispense a specific number of kibble portions immediately from the feeder.
  fields:
    portions:
      name: Portions
      description: Number of kibble portions to dispense (1 to 20).
      required: true
      default: 1
      selector:
        number:
          min: 1
          max: 20
          step: 1
          unit_of_measurement: portions
          mode: box
    entity_id:
      name: Target Entity
      description: Feeder device or entity to target.
      required: false
      selector:
        target:
          entity:
            domain: button

tare_scale:
  name: Tare Bowl Scale
  description: Zero out the weight reading on the stainless steel bowl scale.
  fields:
    entity_id:
      name: Target Entity
      description: Feeder bowl scale entity.
      required: false
      selector:
        target:
          entity:
            domain: button

calibrate_portion:
  name: Calibrate Portion Density
  description: Update the calibrated kibble weight in grams per portion.
  fields:
    grams_per_portion:
      name: Grams Per Portion
      description: Measured kibble weight per single portion dispenser rotation (e.g. 11.5).
      required: true
      default: 11.5
      selector:
        number:
          min: 1.0
          max: 50.0
          step: 0.1
          unit_of_measurement: g
          mode: box

restore_stock_firmware:
  name: 1-Click Restore Factory Firmware
  description: Over-the-air flash the saved genuine factory stock firmware binary back to the feeder via Port 3232, restoring original VeSync operation.
  fields:
    confirm:
      name: Confirm Factory Restore
      description: Must be set to true to execute factory firmware restore.
      required: true
      default: false
      selector:
        boolean:
    host:
      name: Host IP Address
      description: Feeder IP address (optional, automatically discovered from integration if omitted).
      required: false
      selector:
        text:
    mac:
      name: Feeder MAC Address
      description: Feeder MAC address (optional, automatically discovered from integration if omitted).
      required: false
      selector:
        text:

restore_cloud_backup:
  name: Restore Cloud Settings Backup
  description: Restore harvested VeSync cloud settings (meal schedules, portion sizes, dispensing sound, and calibrations) to the adopted PawSync feeder.
  fields:
    mac:
      name: Feeder MAC Address
      description: Feeder MAC address (optional if only one feeder is configured).
      required: false
      selector:
        text:
    entry_id:
      name: Config Entry ID
      description: Home Assistant config entry ID (optional if only one feeder is configured).
      required: false
      selector:
        text:

flash_latest_firmware:
  name: Flash Latest Firmware (with Credentials)
  description: Flash the latest ESPHome firmware to the feeder over Port 3232, dynamically injecting Wi-Fi credentials, Noise PSK, and OTA password.
  fields:
    host:
      name: Host IP Address
      description: Feeder IP address (optional, automatically resolved if omitted).
      required: false
      selector:
        text:
    mac:
      name: Feeder MAC Address
      description: Feeder MAC address (optional, automatically resolved if omitted).
      required: false
      selector:
        text:
